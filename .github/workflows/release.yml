name: Release

# 推送形如 v0.1.0 的 tag 时触发：自动构建 macOS(arm64+x64) 与 Android 产物并创建 Release。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS dmg (arm64 + x64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 package.json version ${PKG_VERSION} 不一致，请先同步版本号。"
            exit 1
          fi
          echo "Version OK: ${TAG_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build bundles (electron-vite)
        run: npm run build

      - name: Package dmg (unsigned, arm64 + x64)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-android:
    name: Build Android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v${TAG_VERSION} 与 package.json version ${PKG_VERSION} 不一致，请先同步版本号。"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 29.0.13113456
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;29.0.13113456"

      - name: Build debug apk
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Stage apk with versioned name
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Prism-${TAG_VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Prism-*-android.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Prism ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
